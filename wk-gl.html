<!doctype html>
<html><body>
<canvas id="c" width="800" height="600"></canvas>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.187.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three'
const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance', alpha:false })
renderer.setClearColor('#0b080c')
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(44, 800/600, 0.15, 220)
camera.position.z = 5
scene.add(new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshBasicMaterial({color:0xff00ff})))
function tick(){ requestAnimationFrame(tick); renderer.render(scene,camera) }
tick()
document.body.dataset.ok='1'
</script>
</body></html>
